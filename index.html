<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pictures of Places – Intro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --sand: #f4ebdf;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--sand);
      overflow-x: hidden;
    }

    /* Gewoon extra hoogte zodat je kunt scrollen */
    body {
      min-height: 300vh;
    }

    /* Hero is nu NIET sticky meer, scrolt mee met de pagina */
    #hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
      background: var(--sand);
    }

    #layers {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .layer {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-position: right top;   /* start rechtsboven */
      background-size: auto 140%;       /* ~140% hoogte */
      pointer-events: none;
      will-change: transform;
    }

    /* Achtergrond */
    .bg {
      background-image: url("images/StartscreenBackground.png");
      z-index: 1;
    }

    /* Beweeg-laag (4.4) MOET onder de andere liggen */
    .layer-44 {
      background-image: url("images/Startscreen4.4.png");
      z-index: 2;               /* onder 3.4 */
      transform: translateX(0);
    }

    /* Stilstaande laag (3.4) erboven */
    .layer-34 {
      background-image: url("images/Startscreen3.4.png");
      z-index: 3;
    }
  </style>
</head>
<body>

  <section id="hero">
    <div id="layers">
      <div class="layer bg"></div>
      <div class="layer layer-44" id="movingLayer"></div>
      <div class="layer layer-34"></div>
    </div>
  </section>

  <script>
    const hero        = document.getElementById('hero');
    const movingLayer = document.getElementById('movingLayer');

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function onScroll() {
      const rect      = hero.getBoundingClientRect();
      const viewportH = window.innerHeight;

      // hoeveel px is de hero al voorbij de bovenkant?
      const offset = -rect.top;          // 0 bij start, >0 als je naar beneden scrolt

      // over welk gebied willen we animeren?
      const totalRange = viewportH * 2;  // 0 → 2 schermhoogtes scroll
      let progress = clamp(offset / totalRange, 0, 1);

      // maximale verschuiving naar rechts
      const maxShiftX = 50; // 50vw

      const tx = progress * maxShiftX;

      // Alleen X verschuiven; geen Y → geen “meebewegen” op Y-as
      movingLayer.style.transform = `translateX(${tx}vw)`;
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
