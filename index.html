<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pictures of Places – Intro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --sand: #f4ebdf;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--sand);
      overflow-x: hidden;
    }

    /* Extra hoogte zodat je kunt scrollen */
    body {
      min-height: 400vh;
    }

    /* Hero blijft op dezelfde Y-plek (sticky) */
    #hero {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--sand);
    }

    #layers {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .layer {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-position: right top;   /* start rechtsboven */
      background-size: auto 140%;       /* ± 140% hoogte */
      pointer-events: none;
      will-change: transform, opacity;
      opacity: 1;
      transform: translateX(0);
    }

    /* Achtergrond */
    .bg {
      background-image: url("images/StartscreenBackground.png");
      z-index: 1;
    }

    /* Volgorde van achter → voor */
    .layer-44 {
      background-image: url("images/Startscreen4.4.png");
      z-index: 2;
    }
    .layer-34 {
      background-image: url("images/Startscreen3.4.png");
      z-index: 3;
    }
    .layer-24 {
      background-image: url("images/Startscreen2.4.png");
      z-index: 4;
    }
    .layer-14 {
      background-image: url("images/Startscreen1.4.png");
      z-index: 5;   /* blijft altijd zichtbaar, beweegt niet */
    }
  </style>
</head>
<body>

  <section id="hero">
    <div id="layers">
      <div class="layer bg"></div>
      <div class="layer layer-44" id="layer44"></div>
      <div class="layer layer-34" id="layer34"></div>
      <div class="layer layer-24" id="layer24"></div>
      <div class="layer layer-14" id="layer14"></div>
    </div>
  </section>

  <script>
    const hero   = document.getElementById('hero');
    const l44    = document.getElementById('layer44');
    const l34    = document.getElementById('layer34');
    const l24    = document.getElementById('layer24');
    // l14 blijft altijd staan, geen animatie nodig

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function animateLayer(layer, progress, start, end, maxShiftVW) {
      // progress 0–1 voor hele timeline, start/end voor dit segment
      if (progress <= start) {
        // vóór segment
        layer.style.transform = 'translateX(0)';
        layer.style.opacity   = '1';
        return;
      }
      if (progress >= end) {
        // ná segment
        layer.style.transform = `translateX(${maxShiftVW}vw)`;
        layer.style.opacity   = '0';
        return;
      }

      // progress binnen eigen segment (0–1)
      const local = (progress - start) / (end - start);

      const tx = local * maxShiftVW;
      const op = 1 - local; // fade out

      layer.style.transform = `translateX(${tx}vw)`;
      layer.style.opacity   = String(op);
    }

    function onScroll() {
      const rect      = hero.getBoundingClientRect();
      const viewportH = window.innerHeight;

      // hoeveel px is de hero al "langs" gescrold?
      const offset = -rect.top;      // 0 bij begin, >0 als je naar beneden scrolt

      // totale tijdlijn: bv. 3 schermhoogtes scroll
      const totalRange = viewportH * 3;
      let progress = clamp(offset / totalRange, 0, 1);  // 0–1

      // we verdelen de timeline in 3 gelijke stukken:
      const phase = 1 / 3;
      const maxShift = 50; // 50vw naar rechts

      // 4.4 beweegt in segment 0.00–0.33
      animateLayer(l44, progress, 0 * phase, 1 * phase, maxShift);
      // 3.4 beweegt in segment 0.33–0.66
      animateLayer(l34, progress, 1 * phase, 2 * phase, maxShift);
      // 2.4 beweegt in segment 0.66–1.00
      animateLayer(l24, progress, 2 * phase, 3 * phase, maxShift);
      // 1.4 doet niks: blijft gewoon staan
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // initiale state
  </script>
</body>
</html>
