<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pictures of Places – Intro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --sand: #f4ebdf;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--sand);
      overflow-x: hidden;
    }

    /* Genoeg hoogte zodat je naar beneden kunt scrollen */
    body {
      min-height: 400vh;
    }

    /* Hero blijft in beeld terwijl je scrollt */
    #hero {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--sand);
    }

    #layers {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .layer {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-position: right top;   /* dezelfde uitlijning */
      background-size: auto 140%;       /* ~140% hoogte */
      pointer-events: none;
      will-change: opacity;
      opacity: 1;
    }

    /* Achtergrond (blijft altijd zichtbaar) */
    .layer-bg {
      background-image: url("images/StartscreenBackground.png");
      z-index: 1;
    }

    /* Van achter naar voor: 4.4 → 3.4 → 2.4 → 1.4 */
    .layer-44 {
      background-image: url("images/Startscreen4.4.png");
      z-index: 2;
    }

    .layer-34 {
      background-image: url("images/Startscreen3.4.png");
      z-index: 3;
    }

    .layer-24 {
      background-image: url("images/Startscreen2.4.png");
      z-index: 4;
    }

    .layer-14 {
      background-image: url("images/Startscreen1.4.png");
      z-index: 5;
    }

    /* Gewoon lege ruimte eronder zodat je kunt scrollen */
    .spacer {
      height: 300vh;
    }
  </style>
</head>
<body>

  <section id="hero">
    <div id="layers">
      <div class="layer layer-bg"></div>
      <div class="layer layer-44" id="layer44"></div>
      <div class="layer layer-34" id="layer34"></div>
      <div class="layer layer-24" id="layer24"></div>
      <div class="layer layer-14" id="layer14"></div>
    </div>
  </section>

  <div class="spacer"></div>

  <script>
    const hero   = document.getElementById('hero');
    const l44    = document.getElementById('layer44');
    const l34    = document.getElementById('layer34');
    const l24    = document.getElementById('layer24');
    const l14    = document.getElementById('layer14');

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function fadeLayer(layer, progress, start, end) {
      if (!layer) return;

      if (progress <= start) {
        layer.style.opacity = '1';
        return;
      }
      if (progress >= end) {
        layer.style.opacity = '0';
        return;
      }

      const local = (progress - start) / (end - start); // 0–1
      const op = 1 - local;
      layer.style.opacity = String(op);
    }

    function onScroll() {
      const scrollY   = window.scrollY || window.pageYOffset;
      const heroTop   = hero.offsetTop;          // waar de hero in de pagina begint
      const viewportH = window.innerHeight;

      // hoe ver zijn we voorbij het begin van de hero gescrold?
      const offset = scrollY - heroTop;

      if (offset <= 0) {
        // helemaal bovenaan: alles zichtbaar
        l44.style.opacity = '1';
        l34.style.opacity = '1';
        l24.style.opacity = '1';
        l14.style.opacity = '1';
        return;
      }

      // totale range waarbinnen alle fades gebeuren (hier: 3 schermhoogtes)
      const totalRange = viewportH * 3;
      let progress = clamp(offset / totalRange, 0, 1); // 0–1

      const phase = 1 / 4; // 4 lagen om weg te faden

      // 4.4 verdwijnt in fase 0.00–0.25
      fadeLayer(l44, progress, 0 * phase, 1 * phase);
      // 3.4 verdwijnt in fase 0.25–0.50
      fadeLayer(l34, progress, 1 * phase, 2 * phase);
      // 2.4 verdwijnt in fase 0.50–0.75
      fadeLayer(l24, progress, 2 * phase, 3 * phase);
      // 1.4 verdwijnt in fase 0.75–1.00
      fadeLayer(l14, progress, 3 * phase, 4 * phase);
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // initial state
  </script>
</body>
</html>
