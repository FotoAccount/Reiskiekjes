<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pictures of Places – Intro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --sand: #f4ebdf;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--sand);
      overflow-x: hidden;
    }

    /* Genoeg hoogte zodat je naar beneden kunt scrollen */
    body {
      min-height: 400vh;
    }

    /* HERO: nu FIXED in plaats van sticky → blijft altijd op dezelfde plek */
    #hero {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--sand);
      z-index: 1;
    }

    #layers {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .layer {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-position: right top;   /* dezelfde uitlijning als eerder */
      background-size: auto 140%;       /* ~140% hoogte */
      pointer-events: none;
      will-change: opacity;
      opacity: 1;
    }

    /* Achtergrond (blijft altijd zichtbaar) */
    .layer-bg {
      background-image: url("images/StartscreenBackground.png");
      z-index: 1;
    }

    /* Van achter naar voor: 4.4 → 3.4 → 2.4 → 1.4 */
    .layer-44 {
      background-image: url("images/Startscreen4.4.png");
      z-index: 2;
    }

    .layer-34 {
      background-image: url("images/Startscreen3.4.png");
      z-index: 3;
    }

    .layer-24 {
      background-image: url("images/Startscreen2.4.png");
      z-index: 4;
    }

    .layer-14 {
      background-image: url("images/Startscreen1.4.png");
      z-index: 5;
    }

    /* Onzichtbare ruimte erachter zodat je kunt scrollen */
    .spacer {
      position: relative;
      z-index: 0;          /* onder de hero */
      height: 400vh;
    }
  </style>
</head>
<body>

  <!-- Vast beeld bovenop alles -->
  <section id="hero">
    <div id="layers">
      <div class="layer layer-bg"></div>
      <div class="layer layer-44" id="layer44"></div>
      <div class="layer layer-34" id="layer34"></div>
      <div class="layer layer-24" id="layer24"></div>
      <div class="layer layer-14" id="layer14"></div>
    </div>
  </section>

  <!-- Alleen om scrollruimte te hebben -->
  <div class="spacer"></div>

   <script>
    const l44 = document.getElementById('layer44');
    const l34 = document.getElementById('layer34');
    const l24 = document.getElementById('layer24');
    const l14 = document.getElementById('layer14'); // blijft straks altijd 1.0

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function fadeLayer(layer, progress, start, end) {
      if (!layer) return;

      if (progress <= start) {
        layer.style.opacity = '1';
        return;
      }
      if (progress >= end) {
        layer.style.opacity = '0';
        return;
      }

      const local = (progress - start) / (end - start); // 0–1
      const op = 1 - local;
      layer.style.opacity = String(op);
    }

    function onScroll() {
      const scrollY   = window.scrollY || window.pageYOffset;
      const viewportH = window.innerHeight;

      // LANGZAMER: we gebruiken nu 6 schermhoogtes in plaats van 3
      const totalRange = viewportH * 6;      // → 2x zo langzaam
      let progress = clamp(scrollY / totalRange, 0, 1); // 0–1

      const phase = 1 / 3; // we hebben nu nog maar 3 lagen die faden

      // 4.4 verdwijnt in fase 0.00–0.33
      fadeLayer(l44, progress, 0 * phase, 1 * phase);
      // 3.4 verdwijnt in fase 0.33–0.66
      fadeLayer(l34, progress, 1 * phase, 2 * phase);
      // 2.4 verdwijnt in fase 0.66–1.00
      fadeLayer(l24, progress, 2 * phase, 3 * phase);

      // 1.4 altijd volledig zichtbaar
      if (l14) {
        l14.style.opacity = '1';
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // initial state
  </script>
</body>
</html>
