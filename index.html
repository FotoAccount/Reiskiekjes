<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pictures of Places – Intro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --bg-sand: #f4ebdf;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
      background: var(--bg-sand);
    }

    /* We hebben scroll nodig om de animatie te triggeren */
body {
  min-height: 200svh; /* niet per se nodig, maar iets consistenter */
}

    /* Vast canvas bovenop alles: hier liggen de duinen */
  .hero {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;

  /* FIX: 100dvh vult ook de safe-area onderaan */
  height: 100dvh;

  /* FIX: iPhone safe-area opheffen */
  padding-bottom: env(safe-area-inset-bottom);

  overflow: hidden;
  background: var(--bg-sand);
  z-index: 1;
}

    #layers {
      position: relative;
      width: 100%;
      height: 100%;
    }

   .layer {
  position: absolute;
  inset: 0;
  background-repeat: no-repeat;
  background-position: right 0px;  /* i.p.v. right top */
  background-size: auto 170%;
  will-change: background-position;
  pointer-events: none;
}

    /* Laag-volgorde: 4.4 onderaan, 1.4 bovenaan */
    .layer-44 {
      background-image: url("images/Startscreen4.4.png");
      z-index: 1;
    }
    .layer-34 {
      background-image: url("images/Startscreen3.4.png");
      z-index: 2;
    }
    .layer-24 {
      background-image: url("images/Startscreen2.4.png");
      z-index: 3;
    }
    .layer-14 {
      background-image: url("images/Startscreen1.4.png");
      z-index: 4;
    }

    /* Tekst in het midden van het scherm */
    .frame-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 6vw, 40px);
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Vast canvas met lagen -->
  <div id="hero">
    <div id="layers">
      <div class="layer layer-44" id="layer44"></div>
      <div class="layer layer-34" id="layer34"></div>
      <div class="layer layer-24" id="layer24"></div>
      <div class="layer layer-14" id="layer14"></div>

      <div class="frame-label" id="frameLabel">frame 1</div>
    </div>
  </div>

  <!-- Lege ruimte puur om te kunnen scrollen -->
  <div style="height: 200vh;"></div>

<script>
  const l44 = document.getElementById('layer44');
  const l34 = document.getElementById('layer34');
  const l24 = document.getElementById('layer24');
  const l14 = document.getElementById('layer14');
  const label = document.getElementById('frameLabel');

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function onScroll() {
    const scrollY   = window.scrollY || window.pageYOffset;
    const viewportH = window.innerHeight;

    // progress 0 → 1 over één schermhoogte
    const progress = clamp(scrollY / viewportH, 0, 1);

    const shiftY = 200 * progress;   // 200px omhoog
    const shiftX = 30  * progress;   // 30vw naar rechts voor 4.4

    // Andere lagen: alleen omhoog (meer van de onderkant zichtbaar)
    const posY = -shiftY; // negatief = beeld omhoog schuiven
    const posYStr = posY + "px";

    l34.style.backgroundPosition = `right ${posYStr}`;
    l24.style.backgroundPosition = `right ${posYStr}`;
    l14.style.backgroundPosition = `right ${posYStr}`;

    // 4.4: omhoog + naar rechts
    const posX44 = `calc(100% + ${shiftX}vw)`;
    l44.style.backgroundPosition = `${posX44} ${posYStr}`;

    // Frame label
    label.textContent = (progress < 0.5) ? "frame 1" : "frame 2";
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>

</body>
</html>
