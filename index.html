<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pictures of Places – Intro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --sand: #f4ebdf;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--sand);
      overflow-x: hidden;
    }

    /* We geven de pagina extra hoogte zodat je iets te scrollen hebt */
    body {
      min-height: 300vh;
    }

    /* Sticky canvas dat in beeld blijft terwijl je scrolt */
    #hero {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--sand);
    }

    #layers {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .layer {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-position: right top;   /* uitlijning */
      background-size: auto 140%;       /* ongeveer 140% van schermhoogte */
      pointer-events: none;
      will-change: transform;
    }

    /* Achtergrondlaag */
    .bg {
      background-image: url("images/StartscreenBackground.png");
      z-index: 1;
    }

    /* Stilstaande laag (3.4) */
    .layer-34 {
      background-image: url("images/Startscreen3.4.png");
      z-index: 2;
    }

    /* Laag die moet bewegen (4.4) */
    .layer-44 {
      background-image: url("images/Startscreen4.4.png");
      z-index: 3;
      transform: translateX(0);
    }
  </style>
</head>
<body>

  <section id="hero">
    <div id="layers">
      <div class="layer bg"></div>
      <div class="layer layer-34"></div>
      <div class="layer layer-44" id="movingLayer"></div>
    </div>
  </section>

  <script>
    const hero        = document.getElementById('hero');
    const movingLayer = document.getElementById('movingLayer');

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function onScroll() {
      const rect      = hero.getBoundingClientRect();
      const viewportH = window.innerHeight;

      // hoeveel px is de hero al "omhoog geschoven" ?
      const offset = -rect.top;

      // over welk bereik willen we animeren?
      const totalRange = viewportH * 2;   // 0 → 2 schermhoogtes scroll
      let progress = clamp(offset / totalRange, 0, 1);

      // maximale verschuiving naar rechts (in viewport-breedtes)
      const maxShiftX = 50; // 50vw

      const tx = progress * maxShiftX;

      movingLayer.style.transform = `translateX(${tx}vw)`;
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // initiale positie instellen
  </script>
</body>
</html>
