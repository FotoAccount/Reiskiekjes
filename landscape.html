<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Landscape</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, height=device-height" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --divider: 30px;
      --anim-ms: 700ms;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, system-ui, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #img, #imgNext {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
      transition: transform var(--anim-ms) ease;
      will-change: transform;
    }

    #imgNext { transform: translateX(100%); }

    #stage.anim #img,
    #stage.anim #imgNext {
      box-shadow: 0 0 0 var(--divider) #000;
    }

    #caption {
      position: absolute;
      left: 5vw;
      bottom: 3vh;
      z-index: 5;
      color: #fff;
      text-shadow: 0 0 6px rgba(0,0,0,0.4);
      pointer-events: none;
      opacity: 0;
      transform: translate(0, 12px);
      transition: opacity .35s ease, transform .35s ease;
    }

    #caption.show {
      opacity: 1;
      transform: translate(0, 0);
    }

    #caption.slide-left,
    #caption.slide-right {
      opacity: 0;
    }

    #caption.slide-left {
      transform: translate(-100%, 0);
    }

    #caption.slide-right {
      transform: translate(100%, 0);
    }

    #caption .place {
      font-size: clamp(16px, 2.8vw, 24px);
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-bottom: 2px;
    }

    #caption .country {
      font-size: clamp(12px, 2vw, 18px);
      font-weight: 400;
      opacity: 0.9;
    }

    #thumbOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 22vh;
      background: rgba(0,0,0,0.69);
      backdrop-filter: blur(6px);
      transform: translateY(-100%);
      transition: transform .35s ease;
      z-index: 10;
      display: flex;
      align-items: center;
      touch-action: pan-x;
    }

    #thumbOverlay.show {
      transform: translateY(0);
    }

    #thumbStrip {
      display: flex;
      gap: 8px;
      padding: 0 16px;
      overflow-x: auto;
      width: 100%;
      scrollbar-width: none;
      touch-action: pan-x;
    }

    #thumbStrip::-webkit-scrollbar {
      display: none;
    }

    #thumbStrip img {
      height: 60px;
      flex-shrink: 0;
      opacity: 0.6;
      border-radius: 3px;
      transition: opacity .2s ease, transform .2s ease, outline .2s ease;
    }

    #thumbStrip img.active {
      opacity: 1;
      transform: scale(1.03);
      outline: 2px solid #fff;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="img" alt="Landscape" />
    <img id="imgNext" alt="Volgende" />

    <div id="caption" aria-live="polite">
      <div class="place"></div>
      <div class="country"></div>
    </div>

    <div id="thumbOverlay">
      <div id="thumbStrip"></div>
    </div>
  </div>

  <script>
    /* =========================
       DATA
    ========================== */

    const slides = [

      { img: "images/A1.jpg",  thumb: "images/AC1.jpg",  place: "Tongariro National Park",           country: "New Zealand" },

      { img: "images/A4.jpg",  thumb: "images/AC4.jpg",  place: "Wildspitze Glacier",                country: "Austria" },
      { img: "images/A5.jpg",  thumb: "images/AC5.jpg",  place: "Whitehaven Beach",                  country: "Australia" },
      { img: "images/A6.jpg",  thumb: "images/AC6.jpg",  place: "Puncak Brinchang Barat",            country: "Malaysia" },
      { img: "images/A7.jpg",  thumb: "images/AC7.jpg",  place: "Noosa National Park",               country: "Australia" },
      { img: "images/A8.jpg",  thumb: "images/AC8.jpg",  place: "Flight: LAX - AMS",                 country: "Greenland" },
      { img: "images/A9.jpg",  thumb: "images/AC9.jpg",  place: "Great Barrier Reef",                country: "Australia" },
      { img: "images/A10.jpg", thumb: "images/AC10.jpg", place: "Flight: LIM – AMS",                 country: "Peru" },
      { img: "images/A11.jpg", thumb: "images/AC11.jpg", place: "Refuge du Roc",                     country: "France" },
      { img: "images/A11_1.jpg", thumb: "images/AC11_1.jpg", place: "Pitztaler Glacier",             country: "Austria" },

      { img: "images/A13.jpg", thumb: "images/AC13.jpg", place: "Rocinha",                           country: "Brazil" },
      { img: "images/A14.jpg", thumb: "images/AC14.jpg", place: "Abu Dhabi",                         country: "United Arab Emirates" },
      { img: "images/A15.jpg", thumb: "images/AC15.jpg", place: "Utrecht",                           country: "The Netherlands" },
      { img: "images/A16.jpg", thumb: "images/AC16.jpg", place: "San Fruttuoso",                     country: "Italy" },

      { img: "images/A19.jpg", thumb: "images/AC19.jpg", place: "Mount Cook Glacier",                country: "New Zealand" },
      { img: "images/A20.jpg", thumb: "images/AC20.jpg", place: "Mount Victoria",                    country: "New Zealand" },
      { img: "images/A21.jpg", thumb: "images/AC21.jpg", place: "Pitztaler Glacier – Ties",          country: "Austria" },
      { img: "images/A22.jpg", thumb: "images/AC22.jpg", place: "Ferry: Wellington - Picton",        country: "New Zealand" },
      { img: "images/A23.jpg", thumb: "images/AC23.jpg", place: "Zillie Falls",                      country: "Australia" },
      { img: "images/A24.jpg", thumb: "images/AC24.jpg", place: "Queenstown",                        country: "New Zealand" },

      { img: "images/A26.jpg", thumb: "images/AC26.jpg", place: "La Motte",                          country: "France" },
      { img: "images/A27.jpg", thumb: "images/AC27.jpg", place: "Wildspitze Glacier",                country: "Austria" },
      { img: "images/A28.jpg", thumb: "images/AC28.jpg", place: "Cristo Redentor",                   country: "Brazil" },
      { img: "images/A29.jpg", thumb: "images/AC29.jpg", place: "Rub’ al Khali",                     country: "United Arab Emirates" },
      { img: "images/A30.jpg", thumb: "images/AC30.jpg", place: "Machu Picchu",                      country: "Peru" },
      { img: "images/A31.jpg", thumb: "images/AC31.jpg", place: "Florance",                          country: "Italy" },
      { img: "images/A32.jpg", thumb: "images/AC32.jpg", place: "Flight: DXB – AMS",                 country: "United Arab Emirates" },
      { img: "images/A33.jpg", thumb: "images/AC33.jpg", place: "Kepler Track",                      country: "New Zealand" },
      { img: "images/A34.jpg", thumb: "images/AC34.jpg", place: "Roy’s Peak",                        country: "New Zealand" },
      { img: "images/A35.jpg", thumb: "images/AC35.jpg", place: "Milla Milla Falls",                 country: "Australia" },
      { img: "images/A36.jpg", thumb: "images/AC36.jpg", place: "Khao Sok",                          country: "Thailand" },
      { img: "images/A37.jpg", thumb: "images/AC37.jpg", place: "Batu Caves",                        country: "Malaysia" },
      { img: "images/A37_1.jpg", thumb: "images/AC37_1.jpg", place: "Sydney",                        country: "Australia" },
      { img: "images/A37_2.jpg", thumb: "images/AC37_2.jpg", place: "Utrecht",                       country: "The Netherlands" },
      { img: "images/A38.jpg", thumb: "images/AC38.jpg", place: "Barra da Tijuca",                   country: "Brazil" },
      { img: "images/A39.jpg", thumb: "images/AC39.jpg", place: "Ta Prohm Temple",                   country: "Cambodia" },
      { img: "images/A40.jpg", thumb: "images/AC40.jpg", place: "Ipanema Beach",                     country: "Brazil" },
      { img: "images/A41.jpg", thumb: "images/AC41.jpg", place: "Pedra do Arpoador",                 country: "Brazil" },
      { img: "images/A42.jpg", thumb: "images/AC42.jpg", place: "Flight: GIG – AMS",                 country: "The Netherlands" },
      { img: "images/A43.jpg", thumb: "images/AC43.jpg", place: "Roy’s Peak",                        country: "New Zealand" },
      { img: "images/A44.jpg", thumb: "images/AC44.jpg", place: "Hinterer Brunnenkogel",             country: "Austria" },
      { img: "images/A45.jpg", thumb: "images/AC45.jpg", place: "Pitzaler Glacier",                  country: "Austria (Made by Alina)" },
      { img: "images/A46.jpg", thumb: "images/AC46.jpg", place: "Alex absolutely eating shit on this landing", country: "Austria" },
      { img: "images/A47.jpg", thumb: "images/AC47.jpg", place: "Joshua Tree National Park",         country: "United States of America" },
      { img: "images/A48.jpg", thumb: "images/AC48.jpg", place: "Nui Beach",                         country: "Thailand" },
      { img: "images/A49.jpg", thumb: "images/AC49.jpg", place: "Rocinha",                           country: "Brazil" },
      { img: "images/A50.jpg", thumb: "images/AC50.jpg", place: "Cameron Highlands",                 country: "Malaysia" },
      { img: "images/A50_1.jpg", thumb: "images/AC50_1.jpg", place: "Bayon Temple",                  country: "Cambodia" },
      { img: "images/A51.jpg", thumb: "images/AC51.jpg", place: "Padang",                            country: "Singapore" },
      { img: "images/A52.jpg", thumb: "images/AC52.jpg", place: "The Grand Palace",                  country: "Thailand" },
      { img: "images/A53.jpg", thumb: "images/AC53.jpg", place: "Rio de Janeiro",                    country: "Brazil" }
    ];

    /* =========================
       ELEMENTEN & STATE
    ========================== */

    let i = 0;
    const stage        = document.getElementById("stage");
    const img          = document.getElementById("img");
    const imgNext      = document.getElementById("imgNext");
    const caption      = document.getElementById("caption");
    const capPlace     = caption.querySelector(".place");
    const capCountry   = caption.querySelector(".country");
    const thumbOverlay = document.getElementById("thumbOverlay");
    const thumbStrip   = document.getElementById("thumbStrip");

    let thumbsVisible = false;

    function setCaption(idx) {
      const m = slides[idx] || { country: "", place: "" };
      capPlace.textContent   = m.place   || "";
      capCountry.textContent = m.country || "";
    }

    function showCaption() {
      if (thumbsVisible) return;
      const m = slides[i] || { country: "", place: "" };
      if (!m.country && !m.place) return;
      caption.classList.remove('slide-left', 'slide-right');
      setCaption(i);
      caption.classList.add("show");
    }

    function hideCaption() {
      caption.classList.remove("show", "slide-left", "slide-right");
    }

    function captionIsVisible() {
      return caption.classList.contains("show");
    }

    function showThumbs() {
      if (captionIsVisible()) return;
      thumbsVisible = true;
      thumbOverlay.classList.add('show');
      updateActiveThumb(i);
      scrollThumbsTo(i);
    }

    function hideThumbs() {
      thumbsVisible = false;
      thumbOverlay.classList.remove('show');
    }

    function buildThumbs() {
      thumbStrip.innerHTML = "";
      slides.forEach((slide, idx) => {
        const t = document.createElement("img");
        t.src = slide.thumb;
        t.dataset.index = idx;
        t.addEventListener("click", ev => {
          ev.stopPropagation();
          if (idx === i) {
            hideThumbs();
            return;
          }
          if (zoomActive) return;
          hideCaption();
          hideThumbs();
          const dir = idx > i ? 1 : -1;
          slideTo(idx, dir);
        });
        thumbStrip.appendChild(t);
      });
      updateActiveThumb(0);
    }

    function updateActiveThumb(index) {
      const imgs = thumbStrip.querySelectorAll("img");
      imgs.forEach(el => {
        el.classList.toggle("active", Number(el.dataset.index) === index);
      });
    }

    function scrollThumbsTo(index) {
      const active = thumbStrip.querySelector(`img[data-index="${index}"]`);
      if (!active) return;
      const container = thumbStrip;
      const target = active.offsetLeft - (container.clientWidth / 2) + (active.clientWidth / 2);
      container.scrollLeft = Math.max(0, target);
    }

    /* --------- Zoom state ---------- */
    let zoom = 1;
    let panX = 0, panY = 0;
    let zoomActive = false;
    let panStartX = 0, panStartY = 0;
    let basePanX = 0, basePanY = 0;
    const ZOOM_FACTOR = 2.5;
    const ZOOM_ANIM_MS = 260;

    function updateTransform() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const maxX = (zoom - 1) * w * 0.5;
      const maxY = (zoom - 1) * h * 0.5;
      panX = Math.max(-maxX, Math.min(maxX, panX));
      panY = Math.max(-maxY, Math.min(maxY, panY));
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    }

    function resetZoom() {
      zoom = 1;
      panX = 0;
      panY = 0;
      zoomActive = false;
      img.style.transition = 'none';
      img.style.transform = 'translate(0,0) scale(1)';
    }

    /* --------- Eerste foto ---------- */
    img.src = slides[i].img;

    const DURATION = 700;
    let animating = false;

    function slideTo(nextIndex, direction) {
      if (animating) return;
      animating = true;
      stage.classList.add("anim");

      let captionSliding = false;
      if (caption.classList.contains('show')) {
        captionSliding = true;
        caption.classList.remove('show', 'slide-left', 'slide-right');
        caption.style.transition = `transform ${DURATION}ms ease, opacity ${DURATION}ms ease`;
        if (direction === 1) {
          caption.classList.add('slide-left');
        } else {
          caption.classList.add('slide-right');
        }
      }

      const nextSrc = slides[nextIndex].img;
      const preImg = new Image();
      preImg.src = nextSrc;

      preImg.onload = () => {
        imgNext.src = nextSrc;
        imgNext.style.transition = "none";
        img.style.transition = "none";
        imgNext.style.transform = `translateX(${direction * 100}%)`;

        requestAnimationFrame(() => {
          imgNext.style.transition = `transform ${DURATION}ms ease`;
          img.style.transition = `transform ${DURATION}ms ease`;
          img.style.transform = `translateX(${-direction * 100}%)`;
          imgNext.style.transform = "translateX(0)";
        });

        setTimeout(() => {
          img.src = nextSrc;
          img.style.transition = "none";
          img.style.transform = "translateX(0)";
          imgNext.style.transition = "none";
          imgNext.style.transform = "translateX(100%)";
          i = nextIndex;
          animating = false;
          stage.classList.remove("anim");
          resetZoom();

          if (captionSliding) {
            caption.classList.remove('slide-left', 'slide-right');
            caption.style.transition = '';
          }

          updateActiveThumb(i);
          if (thumbsVisible) scrollThumbsTo(i);

          const preloadNext = new Image();
          preloadNext.src = slides[(nextIndex + 1) % slides.length].img;
        }, DURATION);
      };

      preImg.onerror = () => {
        console.warn("Kon afbeelding niet laden:", nextSrc);
        animating = false;
        stage.classList.remove("anim");
        if (captionSliding) {
          caption.classList.remove('slide-left', 'slide-right');
          caption.style.transition = '';
        }
      };
    }

    function next() { slideTo((i + 1) % slides.length, 1); }
    function prev() { slideTo((i - 1 + slides.length) % slides.length, -1); }

    /* --------- Gesture handling ---------- */
    let sx = 0, sy = 0, t0 = 0;
    let startAtTop = false;
    let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

    const EDGE = 24, SW = 40, SWIPE_Y = 40;

    function isInThumbOverlay(e) {
      return e.target.closest && e.target.closest('#thumbOverlay');
    }

    let overlayStartY = 0, overlayT0 = 0;
    thumbOverlay.addEventListener('touchstart', e => {
      const t = e.touches[0];
      overlayStartY = t.clientY;
      overlayT0 = Date.now();
    }, { passive: true });

    thumbOverlay.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dy = t.clientY - overlayStartY;
      const dt = Date.now() - overlayT0;
      if (dy < -SWIPE_Y && dt < 800 && thumbsVisible) {
        hideThumbs();
      }
    }, { passive: true });

    stage.addEventListener("touchstart", e => {
      if (isInThumbOverlay(e)) return;

      const t = e.touches[0];

      if (zoomActive) {
        img.style.transition = 'none';
        panStartX = t.clientX;
        panStartY = t.clientY;
        basePanX = panX;
        basePanY = panY;
      } else {
        sx = t.clientX;
        sy = t.clientY;
        t0 = Date.now();
        startAtTop = sy < 80;
        if (sx < EDGE || sx > window.innerWidth - EDGE) { sx = sy = 0; }
      }
    }, { passive: true });

    stage.addEventListener("touchmove", e => {
      if (isInThumbOverlay(e)) return;
      if (!zoomActive) return;
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - panStartX;
      const dy = t.clientY - panStartY;
      panX = basePanX + dx;
      panY = basePanY + dy;
      updateTransform();
    }, { passive: false });

    stage.addEventListener("touchend", e => {
      if (isInThumbOverlay(e)) return;

      const t = e.changedTouches[0];
      const now = Date.now();

      const dxTap = t.clientX - lastTapX;
      const dyTap = t.clientY - lastTapY;
      const dtTap = now - lastTapTime;
      const doubleTap = dtTap < 300 && Math.abs(dxTap) < 20 && Math.abs(dyTap) < 20;

      if (doubleTap) {
        if (!zoomActive) {
          zoomActive = true;
          img.style.transition = `transform ${ZOOM_ANIM_MS}ms ease-out`;
          zoom = ZOOM_FACTOR;
          const w = window.innerWidth;
          const h = window.innerHeight;
          const cx = t.clientX - w / 2;
          const cy = t.clientY - h / 2;
          panX = -(zoom - 1) * cx;
          panY = -(zoom - 1) * cy;
          updateTransform();
          setTimeout(() => { img.style.transition = 'none'; }, ZOOM_ANIM_MS);
        } else {
          img.style.transition = `transform ${ZOOM_ANIM_MS}ms ease-out`;
          zoom = 1;
          panX = 0;
          panY = 0;
          updateTransform();
          setTimeout(() => {
            img.style.transition = 'none';
            zoomActive = false;
          }, ZOOM_ANIM_MS);
        }
        lastTapTime = 0;
        return;
      } else {
        lastTapTime = now;
        lastTapX = t.clientX;
        lastTapY = t.clientY;
      }

      if (zoomActive) return;

      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      const dt = now - t0;
      const isHorizontal = Math.abs(dx) > Math.abs(dy);
      const isVertical   = !isHorizontal;

      if (thumbsVisible) {
        if (isHorizontal && Math.abs(dx) > SW && dt < 1000) {
          hideThumbs();
          dx < 0 ? next() : prev();
        } else if (isVertical && Math.abs(dy) > SWIPE_Y && dt < 800) {
          hideThumbs();
        }
        return;
      }

      if (captionIsVisible()) {
        if (isHorizontal && Math.abs(dx) > SW && dt < 1000) {
          hideCaption();
          dx < 0 ? next() : prev();
        } else if (isVertical && Math.abs(dy) > SWIPE_Y && dt < 800) {
          hideCaption();
        }
        return;
      }

      if (isVertical && dy > SWIPE_Y && dt < 800) {
        showThumbs();
        return;
      }

      if (isHorizontal && Math.abs(dx) > SW && dt < 1000) {
        dx < 0 ? next() : prev();
        return;
      }

      if (isVertical && Math.abs(dy) > SWIPE_Y && dt < 800) {
        if (dy < 0) showCaption();
      }
    }, { passive: true });

    document.addEventListener("keydown", e => {
      if (zoomActive) {
        if (e.key.toLowerCase?.() === "z") resetZoom();
        return;
      }
      if (e.key === "ArrowRight") next();
      if (e.key === "ArrowLeft")  prev();
      if (e.key.toLowerCase?.() === "i") {
        if (caption.classList.contains("show")) hideCaption();
        else showCaption();
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    document.addEventListener("touchmove", e => {
      if (thumbsVisible && e.target.closest && e.target.closest('#thumbStrip')) {
        return;
      }
      if (!zoomActive) {
        e.preventDefault();
      }
    }, { passive: false });

    buildThumbs();
  </script>
</body>
</html>
