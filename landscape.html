<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Landscape</title>

  <!-- PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, height=device-height" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --divider: 30px;
      --anim-ms: 700ms;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, system-ui, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #img, #imgNext {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
      transition: transform var(--anim-ms) ease;
      will-change: transform;
    }

    #imgNext { transform: translateX(100%); }

    #stage.anim #img,
    #stage.anim #imgNext {
      box-shadow: 0 0 0 var(--divider) #000;
    }

    /* Caption onder-links */
    #caption {
      position: absolute;
      left: 5vw;
      bottom: 3vh;
      z-index: 5;
      color: #fff;
      text-shadow: 0 0 6px rgba(0,0,0,0.4);
      pointer-events: none;
      opacity: 0;
      transform: translate(0, 12px);
      transition: opacity .35s ease, transform .35s ease;
    }

    #caption.show {
      opacity: 1;
      transform: translate(0, 0);
    }

    #caption.slide-left,
    #caption.slide-right {
      opacity: 0;
    }

    #caption.slide-left {
      transform: translate(-100%, 0);
    }

    #caption.slide-right {
      transform: translate(100%, 0);
    }

    #caption .place {
      font-size: clamp(16px, 2.8vw, 24px);
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-bottom: 2px;
    }

    #caption .country {
      font-size: clamp(12px, 2vw, 18px);
      font-weight: 400;
      opacity: 0.9;
    }

    /* Thumbnail-overlay bovenin */
    #thumbOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 22vh;
      background: rgba(0,0,0,0.69);
      backdrop-filter: blur(6px);
      transform: translateY(-100%);
      transition: transform .35s ease;
      z-index: 10;
      display: flex;
      align-items: center;
      touch-action: pan-x;
    }

    #thumbOverlay.show {
      transform: translateY(0);
    }

    #thumbStrip {
      display: flex;
      gap: 8px;
      padding: 0 16px;
      overflow-x: auto;
      width: 100%;
      scrollbar-width: none;
      touch-action: pan-x;
    }

    #thumbStrip::-webkit-scrollbar {
      display: none;
    }

    #thumbStrip img {
      height: 60px;
      flex-shrink: 0;
      opacity: 0.6;
      border-radius: 3px;
      transition: opacity .2s ease, transform .2s ease, outline .2s ease;
    }

    #thumbStrip img.active {
      opacity: 1;
      transform: scale(1.03);
      outline: 2px solid #fff;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="img" alt="Landscape" />
    <img id="imgNext" alt="Volgende" />

    <!-- Caption -->
    <div id="caption" aria-live="polite">
      <div class="place"></div>
      <div class="country"></div>
    </div>

    <!-- Thumbnail-balk -->
    <div id="thumbOverlay">
      <div id="thumbStrip"></div>
    </div>
  </div>

  <script>
    /* =========================
       DATA
    ==========================*/

    // NU: 54 foto's → A0 t/m A53, en aparte kleine thumbs AC0 t/m AC53
    const images = Array.from({ length: 54 }, (_, n) => `images/A${n}.jpg`);
    const thumbs = Array.from({ length: 54 }, (_, n) => `images/AC${n}.jpg`);

    // meta mag gewoon langer zijn dan gevuld; lege entries krijgen geen caption
       const meta = Array.from({ length: images.length }, () => ({ country: "", place: "" }));

    meta[1]  = { place: "Tongariro National Park",        country: "New Zealand" };
    meta[2]  = { place: "Mount John",                     country: "New Zealand" };
    meta[3]  = { place: "Angkor Wat",                     country: "Cambodia" };
    meta[4]  = { place: "Wildspitze Glacier",             country: "Austria" };
    meta[5]  = { place: "Whitehaven Beach",               country: "Australia" };
    meta[6]  = { place: "Puncak Brinchang Barat",         country: "Malaysia" };
    meta[7]  = { place: "Noosa National Park",            country: "Australia" };
    meta[8]  = { place: "Flight: LAX - AMS",              country: "Greenland" };
    meta[9]  = { place: "Great Barrier Reef",             country: "Australia" };
    meta[10] = { place: "Flight: LIM – AMS",              country: "Peru" };
    meta[11] = { place: "Refuge du Roc",                  country: "France" };
    meta[12] = { place: "Loh Lana Bay",                   country: "Thailand" };
    meta[13] = { place: "Rocinha",                        country: "Brazil" };
    meta[14] = { place: "Abu Dhabi",                      country: "United Arab Emirates" };
    meta[15] = { place: "Utrecht",                        country: "The Netherlands" };
    meta[16] = { place: "San Fruttuoso",                  country: "Italy" };
    meta[17] = { place: "Cameron Highlands",              country: "Malaysia" };
    meta[18] = { place: "Cameron Highlands",              country: "Malaysia" };
    meta[19] = { place: "Mount Cook Glacier",             country: "New Zealand" };
    meta[20] = { place: "Mount Victoria",                 country: "New Zealand" };
    meta[21] = { place: "Pitztaler Glacier – Ties",       country: "Austria" };
    meta[22] = { place: "Ferry: Wellington - Picton",     country: "New Zealand" };
    meta[23] = { place: "Zillie Falls",                   country: "Australia" };
    meta[24] = { place: "Queenstown",                     country: "New Zealand" };
    meta[25] = { place: "K’gari",                         country: "Australia" };
    meta[26] = { place: "La Motte",                       country: "France" };
    meta[27] = { place: "Wildspitze Glacier",             country: "Austria" };
    meta[28] = { place: "Cristo Redentor",                country: "Brazil" };
    meta[29] = { place: "Rub’ al Khali",                  country: "United Arab Emirates" };
    meta[30] = { place: "Machu Picchu",                   country: "Peru" };
    meta[31] = { place: "Florance",                       country: "Italy" };
    meta[32] = { place: "Flight: DXB – AMS",              country: "United Arab Emirates" };
    meta[33] = { place: "Kepler Track",                   country: "New Zealand" };
    meta[34] = { place: "Roy’s Peak",                     country: "New Zealand" };
    meta[35] = { place: "Milla Milla Falls",              country: "Australia" };
    meta[36] = { place: "Khao Sok",                       country: "Thailand" };
    meta[37] = { place: "Batu Caves",                     country: "Malaysia" };
    meta[38] = { place: "Barra da Tijuca",                country: "Brazil" };
    meta[39] = { place: "Ta Prohm Temple",                country: "Cambodia" };
    meta[40] = { place: "Ipanema Beach",                  country: "Brazil" };
    meta[41] = { place: "Pedra do Arpoador",              country: "Brazil" };
    meta[42] = { place: "Flight: GIG – AMS",              country: "The Netherlands" };
    meta[43] = { place: "Roy’s Peak",                     country: "New Zealand" };
    meta[44] = { place: "Hinterer Brunnenkogel",          country: "Austria" };
    meta[45] = { place: "Pitzaler Glacier",               country: "Austria (Made by Alina)" };
    meta[46] = { place: "Alex absolutely eating shit on this landing", country: "Austria" };
    meta[47] = { place: "Joshua Tree National Park",      country: "United States of America" };
    meta[48] = { place: "Nui Beach",                      country: "Thailand" };
    meta[49] = { place: "Rocinha",                        country: "Brazil" };
    meta[50] = { place: "Cameron Highlands",              country: "Malaysia" };
    meta[51] = { place: "Padang",                         country: "Singapore" };
    meta[52] = { place: "The Grand Palace",               country: "Thailand" };
    meta[53] = { place: "Rio de Janeiro",                 country: "Brazil" };
    /* =========================
       ELEMENTEN & STATE
    ==========================*/

    let i = 0;
    const stage        = document.getElementById("stage");
    const img          = document.getElementById("img");
    const imgNext      = document.getElementById("imgNext");
    const caption      = document.getElementById("caption");
    const capPlace     = caption.querySelector(".place");
    const capCountry   = caption.querySelector(".country");
    const thumbOverlay = document.getElementById("thumbOverlay");
    const thumbStrip   = document.getElementById("thumbStrip");

    let thumbsVisible = false;

    function setCaption(idx) {
      const m = meta[idx] || { country: "", place: "" };
      capPlace.textContent   = m.place   || "";
      capCountry.textContent = m.country || "";
    }

    function showCaption() {
      // NIEUW: caption alleen tonen als thumbOverlay NIET open is
      if (thumbsVisible) return;
      const m = meta[i] || { country: "", place: "" };
      if (!m.country && !m.place) return;
      caption.classList.remove('slide-left', 'slide-right');
      setCaption(i);
      caption.classList.add("show");
    }

    function hideCaption() {
      caption.classList.remove("show", "slide-left", "slide-right");
    }

    function captionIsVisible() {
      return caption.classList.contains("show");
    }

    function showThumbs() {
      // NIEUW: thumbs alleen tonen als caption NIET open is
      if (captionIsVisible()) return;
      thumbsVisible = true;
      thumbOverlay.classList.add('show');
      updateActiveThumb(i);
      scrollThumbsTo(i);
    }

    function hideThumbs() {
      thumbsVisible = false;
      thumbOverlay.classList.remove('show');
    }

    function buildThumbs() {
      thumbStrip.innerHTML = "";
      images.forEach((src, idx) => {
        const t = document.createElement("img");
        t.src = thumbs[idx]; // kleine versie
        t.dataset.index = idx;
        t.addEventListener("click", ev => {
          ev.stopPropagation();
          if (idx === i) {
            hideThumbs();
            return;
          }
          if (zoomActive) return;
          hideCaption();
          hideThumbs();
          const dir = idx > i ? 1 : -1;
          slideTo(idx, dir);
        });
        thumbStrip.appendChild(t);
      });
      updateActiveThumb(0);
    }

    function updateActiveThumb(index) {
      const imgs = thumbStrip.querySelectorAll("img");
      imgs.forEach(el => {
        el.classList.toggle("active", Number(el.dataset.index) === index);
      });
    }

    function scrollThumbsTo(index) {
      const active = thumbStrip.querySelector(`img[data-index="${index}"]`);
      if (!active) return;
      const container = thumbStrip;
      const target = active.offsetLeft - (container.clientWidth / 2) + (active.clientWidth / 2);
      container.scrollLeft = Math.max(0, target);
    }

    /* --------- Zoom state (double-tap) ---------- */
    let zoom = 1;
    let panX = 0, panY = 0;
    let zoomActive = false;
    let panStartX = 0, panStartY = 0;
    let basePanX = 0, basePanY = 0;
    const ZOOM_FACTOR = 2.5;
    const ZOOM_ANIM_MS = 260;

    function updateTransform() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const maxX = (zoom - 1) * w * 0.5;
      const maxY = (zoom - 1) * h * 0.5;
      panX = Math.max(-maxX, Math.min(maxX, panX));
      panY = Math.max(-maxY, Math.min(maxY, panY));
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    }

    function resetZoom() {
      zoom = 1;
      panX = 0;
      panY = 0;
      zoomActive = false;
      img.style.transition = 'none';
      img.style.transform = 'translate(0,0) scale(1)';
    }

    /* --------- Eerste foto ---------- */
    img.src = images[i];

    const DURATION = 700;
    let animating = false;

    function slideTo(nextIndex, direction) {
      if (animating) return;
      animating = true;
      stage.classList.add("anim");

      // Caption mee laten schuiven met de foto
      let captionSliding = false;
      if (caption.classList.contains('show')) {
        captionSliding = true;
        caption.classList.remove('show', 'slide-left', 'slide-right');
        caption.style.transition = `transform ${DURATION}ms ease, opacity ${DURATION}ms ease`;
        if (direction === 1) {
          caption.classList.add('slide-left');
        } else {
          caption.classList.add('slide-right');
        }
      }

      const nextSrc = images[nextIndex];
      const preImg = new Image();
      preImg.src = nextSrc;

      preImg.onload = () => {
        imgNext.src = nextSrc;
        imgNext.style.transition = "none";
        img.style.transition = "none";
        imgNext.style.transform = `translateX(${direction * 100}%)`;

        requestAnimationFrame(() => {
          imgNext.style.transition = `transform ${DURATION}ms ease`;
          img.style.transition = `transform ${DURATION}ms ease`;
          img.style.transform = `translateX(${-direction * 100}%)`;
          imgNext.style.transform = "translateX(0)";
        });

        setTimeout(() => {
          img.src = nextSrc;
          img.style.transition = "none";
          img.style.transform = "translateX(0)";
          imgNext.style.transition = "none";
          imgNext.style.transform = "translateX(100%)";
          i = nextIndex;
          animating = false;
          stage.classList.remove("anim");
          resetZoom();

          if (captionSliding) {
            caption.classList.remove('slide-left', 'slide-right');
            caption.style.transition = ''; // terug naar CSS default
          }

          updateActiveThumb(i);
          if (thumbsVisible) scrollThumbsTo(i);

          const preloadNext = new Image();
          preloadNext.src = images[(nextIndex + 1) % images.length];
        }, DURATION);
      };

      preImg.onerror = () => {
        console.warn("Kon afbeelding niet laden:", nextSrc);
        animating = false;
        stage.classList.remove("anim");
        if (captionSliding) {
          caption.classList.remove('slide-left', 'slide-right');
          caption.style.transition = '';
        }
      };
    }

    function next() { slideTo((i + 1) % images.length, 1); }
    function prev() { slideTo((i - 1 + images.length) % images.length, -1); }

    /* --------- Gesture handling ---------- */
    let sx = 0, sy = 0, t0 = 0;
    let startAtTop = false;
    let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

    const EDGE = 24, SW = 40, SWIPE_Y = 40;

    function isInThumbOverlay(e) {
      return e.target.closest && e.target.closest('#thumbOverlay');
    }

    // Balk omhoog swipen om te sluiten
    let overlayStartY = 0, overlayT0 = 0;
    thumbOverlay.addEventListener('touchstart', e => {
      const t = e.touches[0];
      overlayStartY = t.clientY;
      overlayT0 = Date.now();
    }, { passive: true });

    thumbOverlay.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dy = t.clientY - overlayStartY;
      const dt = Date.now() - overlayT0;
      if (dy < -SWIPE_Y && dt < 800 && thumbsVisible) {
        hideThumbs();
      }
    }, { passive: true });

    // touchstart hoofdbeeld
    stage.addEventListener("touchstart", e => {
      if (isInThumbOverlay(e)) return;

      const t = e.touches[0];

      if (zoomActive) {
        img.style.transition = 'none';
        panStartX = t.clientX;
        panStartY = t.clientY;
        basePanX = panX;
        basePanY = panY;
      } else {
        sx = t.clientX;
        sy = t.clientY;
        t0 = Date.now();
        startAtTop = sy < 80;
        if (sx < EDGE || sx > window.innerWidth - EDGE) { sx = sy = 0; }
      }
    }, { passive: true });

    // pannen tijdens zoom
    stage.addEventListener("touchmove", e => {
      if (isInThumbOverlay(e)) return;
      if (!zoomActive) return;
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - panStartX;
      const dy = t.clientY - panStartY;
      panX = basePanX + dx;
      panY = basePanY + dy;
      updateTransform();
    }, { passive: false });

   // touchend
stage.addEventListener("touchend", e => {
  if (isInThumbOverlay(e)) return;

  const t = e.changedTouches[0];
  const now = Date.now();

  // Double-tap detectie (zoom)
  const dxTap = t.clientX - lastTapX;
  const dyTap = t.clientY - lastTapY;
  const dtTap = now - lastTapTime;

  const doubleTap = dtTap < 300 && Math.abs(dxTap) < 20 && Math.abs(dyTap) < 20;

  if (doubleTap) {
    if (!zoomActive) {
      // Zoom IN op tikpositie
      zoomActive = true;
      img.style.transition = `transform ${ZOOM_ANIM_MS}ms ease-out`;
      zoom = ZOOM_FACTOR;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const cx = t.clientX - w / 2;
      const cy = t.clientY - h / 2;
      panX = -(zoom - 1) * cx;
      panY = -(zoom - 1) * cy;
      updateTransform();
      setTimeout(() => { img.style.transition = 'none'; }, ZOOM_ANIM_MS);
    } else {
      // Smooth uitzoomen
      img.style.transition = `transform ${ZOOM_ANIM_MS}ms ease-out`;
      zoom = 1;
      panX = 0;
      panY = 0;
      updateTransform();
      setTimeout(() => {
        img.style.transition = 'none';
        zoomActive = false;
      }, ZOOM_ANIM_MS);
    }
    lastTapTime = 0;
    return;
  } else {
    lastTapTime = now;
    lastTapX = t.clientX;
    lastTapY = t.clientY;
  }

  if (zoomActive) return;

  const dx = t.clientX - sx;
  const dy = t.clientY - sy;
  const dt = now - t0;
  const isHorizontal = Math.abs(dx) > Math.abs(dy);
  const isVertical   = !isHorizontal;

  /* ========= ALS MENU OPEN IS ========= */
  if (thumbsVisible) {
    // Horizontale swipe → volgende/vorige foto + menu weg
    if (isHorizontal && Math.abs(dx) > SW && dt < 1000) {
      hideThumbs();
      dx < 0 ? next() : prev();
    }
    // Verticale swipe → alleen menu sluiten
    else if (isVertical && Math.abs(dy) > SWIPE_Y && dt < 800) {
      hideThumbs();
    }
    return;
  }

  /* ========= ALS CAPTION OPEN IS ========= */
  if (captionIsVisible()) {
    // Horizontale swipe → volgende/vorige foto + caption weg
    if (isHorizontal && Math.abs(dx) > SW && dt < 1000) {
      hideCaption();
      dx < 0 ? next() : prev();
    }
    // Verticale swipe → alleen caption sluiten
    else if (isVertical && Math.abs(dy) > SWIPE_Y && dt < 800) {
      hideCaption();
    }
    return;
  }

  /* ========= NORMALE CASE (geen menu, geen caption) ========= */

  // Verticaal omlaag → thumbnails tonen (overal op het scherm)
  if (isVertical && dy > SWIPE_Y && dt < 800) {
    showThumbs();
    return;
  }

  // Horizontale swipe → foto wisselen
  if (isHorizontal && Math.abs(dx) > SW && dt < 1000) {
    dx < 0 ? next() : prev();
    return;
  }

  // Verticaal → caption aan (alleen omhoog, want omlaag is menu)
  if (isVertical && Math.abs(dy) > SWIPE_Y && dt < 800) {
    if (dy < 0) showCaption();
  }
}, { passive: true });

    // Desktop: pijltjes + 'i' + 'z'
    document.addEventListener("keydown", e => {
      if (zoomActive) {
        if (e.key.toLowerCase?.() === "z") resetZoom();
        return;
      }
      if (e.key === "ArrowRight") next();
      if (e.key === "ArrowLeft")  prev();
      if (e.key.toLowerCase?.() === "i") {
        if (caption.classList.contains("show")) hideCaption();
        else showCaption();
      }
    });

    /* --------- PWA & rubber-band fix ---------- */
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    document.addEventListener("touchmove", e => {
      if (thumbsVisible && e.target.closest && e.target.closest('#thumbStrip')) {
        return;
      }
      if (!zoomActive) {
        e.preventDefault();
      }
    }, { passive: false });

    /* --------- Init ---------- */
    buildThumbs();
  </script>
</body>
</html>
